[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-chamber"
version = "0.1.0"
description = "Static content generator for music chamber sessions"
requires-python = ">=3.14"
dependencies = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-material[imaging]",
    "mkdocs-rss-plugin",
    "beautifulsoup4",
    "curl-cffi",
    "colorama",
    "markdownify",
    "ollama",
]

[tool.setuptools]
packages = ["utils"]
package-dir = {"utils" =  "scripts/utils"}

[tool.pyright]
exclude = ["**/*"]
include = ["scripts/**/*.py"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "properdocs>=1.6.7",
    "pyright>=1.1.408",
    "ruff>=0.15.10",
]

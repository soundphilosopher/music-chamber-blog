[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-chamber"
version = "0.1.0"
description = "Static content generator for music chamber sessions"
requires-python = ">=3.14"
dependencies = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-material[imaging]",
    "mkdocs-rss-plugin",
    "beautifulsoup4",
    "curl-cffi",
    "html-to-markdown",
]

[project.optional-dependencies]
dev = [
    "pyright"
]

[tool.setuptools]
packages = ["utils"]
package-dir = {"utils" =  "scripts/utils"}

[tool.pyright]
exclude = ["**/*"]
include = ["scripts/**/*.py"]
